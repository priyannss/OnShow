<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the favicon -->
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F84565;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E73956;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="14" fill="url(#faviconGradient)"/>
  
  <!-- Letter 'O' -->
  <text x="16" y="22" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">O</text>
  
  <!-- Ticket notches -->
  <rect x="6" y="12" width="2" height="1.5" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="6" y="18" width="2" height="1.5" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="24" y="12" width="2" height="1.5" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="24" y="18" width="2" height="1.5" rx="0.5" fill="white" opacity="0.9"/>
</svg>